 <!-- Evento 3 -->

<script>
document.querySelectorAll(".evento-card").forEach(card => {

  const logo = card.getAttribute("data-logo");

  if(logo){
    card.style.setProperty("--logo-url", `url(${logo})`);
  }

});
</script>
